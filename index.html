<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILZA AI - Assistant Intelligent</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --chat-bg: #161b26;
            --accent-pink: #ff2a85;
            --accent-blue: #00f0ff;
            --text-color: #ffffff;
            --text-gray: #8b9bb4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px 20px;
            background-color: var(--chat-bg);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.2rem;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status {
            font-size: 0.8rem;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-blue);
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.ai {
            background-color: var(--chat-bg);
            border-left: 3px solid var(--accent-blue);
            align-self: flex-start;
        }

        .message.user {
            background: linear-gradient(135deg, var(--accent-pink), #c2185b);
            color: white;
            align-self: flex-end;
        }

        .input-container {
            padding: 15px;
            background-color: var(--chat-bg);
            border-top: 1px solid rgba(255, 42, 133, 0.2);
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            background-color: #0d0f18;
            border: 1px solid rgba(139, 155, 180, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
        }

        button {
            padding: 0 20px;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-blue));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>ILZA AI</h1>
        <div class="status">
            <div class="status-dot"></div>
            En ligne
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            Bonjour ! Je suis ILZA, ton assistant virtuel intelligent. Comment puis-je t'aider aujourd'hui ?
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Écris ton message à ILZA..." autocomplete="off">
        <button id="sendBtn">Envoyer</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleUserMessage() {
            const text = userInput.value.trim();
            if (text === '') return;

            addMessage(text, 'user');
            userInput.value = '';

            // Simulation de réponse de l'IA (tu pourras connecter ton API ici plus tard)
            setTimeout(() => {
                let reply = "C'est une excellente question ! Je traite ton information.";
                if (text.toLowerCase().includes('bonjour') || text.toLowerCase().includes('salut')) {
                    reply = "Salut ! Prêt à coder de superbes projets ensemble ?";
                } else if (text.toLowerCase().includes('qui es-tu')) {
                    reply = "Je suis ILZA AI, une intelligence artificielle conçue pour t'accompagner.";
                }
                addMessage(reply, 'ai');
            }, 1000);
        }

        sendBtn.addEventListener('click', handleUserMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleUserMessage();
            }
        });
    </script>

</body>

  </html>
